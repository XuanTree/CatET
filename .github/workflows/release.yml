name: Build & Release

# 打 tag（v*）即自动构建三平台安装包并发布到 GitHub Releases；
# 也可在 Actions 页面手动触发，此时只产出可下载的 artifacts（不创建 Release）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀，如 0.7.0；留空则取 tag 名，手动触发请填写）"
        required: false
        default: ""

# 创建/更新 Release 需要写权限
permissions:
  contents: write

# 同一个 tag/分支串行，避免并发写同一个 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Windows：MSYS2 MINGW64（与 CMakePresets.json 路径一致）+ NSIS 安装向导 ──
  windows:
    name: Windows x64 (NSIS installer)
    runs-on: windows-latest
    env:
      # Windows 控制台默认 cp1252 / GBK：让本 job 内所有 Python 步骤按 UTF-8
      # 输出，避免中文日志把步骤打成失败（fetch_font.py 内也做了同样处理）。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "$env:GITHUB_REF_NAME" }
          $v = $v -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "本次构建版本号: $v"

      # 仓库不收录 assets/fonts/pixel_font.ttf（许可原因），构建前取回，
      # 使其与本地开发一致地被 pack_assets.py 内嵌进可执行文件。
      - name: 取回内嵌 UI 字体
        continue-on-error: true
        run: python .github/scripts/fetch_font.py

      # NSIS 优先用 MSYS2 包（下面装），choco 仅作兜底，失败不阻断
      - name: 安装 NSIS（兜底）
        continue-on-error: true
        run: choco install nsis --no-progress -y

      - name: 安装 MSYS2 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-python
            mingw-w64-x86_64-nsis

      # 工具链自检：失败时能直接从日志看出是缺工具还是路径不对
      - name: 工具链自检
        shell: msys2 {0}
        run: |
          echo "MINGW_PREFIX=$MINGW_PREFIX"
          cmake --version | head -1
          gcc --version | head -1
          python -V
          for t in mingw32-make make makensis windres; do
            printf '%-14s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      # 刻意不复用 CMakePresets.json：里面写死了 C:/msys64/mingw64/... 的绝对
      # 路径，一旦 runner 上 MSYS2 的安装位置不同就会配置失败。这里让 CMake
      # 直接从 PATH 找 gcc/make，并显式指定 Python 解释器。
      - name: 构建 + NSIS 打包
        shell: msys2 {0}
        env:
          CATET_VERSION: ${{ steps.ver.outputs.version }}
          MSYSTEM: MINGW64
        run: |
          set -euo pipefail
          # 所有路径都用 cygpath -m 转成本机绝对路径（正斜杠），
          # 避免把 /mingw64/... 这类 MSYS 路径直接交给原生 CMake。
          PY="$(cygpath -m "$(command -v python)")"
          CC_BIN="$(cygpath -m "$(command -v gcc)")"
          CXX_BIN="$(cygpath -m "$(command -v g++)")"
          MAKE_BIN="$(cygpath -m "$(command -v mingw32-make)")"
          echo "Python: $PY"
          echo "CC:     $CC_BIN"
          echo "CXX:    $CXX_BIN"
          echo "MAKE:   $MAKE_BIN"

          # 显式钉住编译器与构建器：CMake 在 Windows runner 上的自动探测不可靠，
          # 之前沿用 CMakePresets.json 里写死的 C:/msys64/mingw64/bin/gcc.exe 时
          # 直接报 "The C compiler identification is unknown"。
          cmake -S . -B out/build/ci-win -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DPython3_EXECUTABLE="$PY" \
            -DCMAKE_C_COMPILER="$CC_BIN" \
            -DCMAKE_CXX_COMPILER="$CXX_BIN" \
            -DCMAKE_MAKE_PROGRAM="$MAKE_BIN"
          cmake --build out/build/ci-win -j"$(nproc)"

          # makensis 查找：MSYS2 的 mingw-w64-x86_64-nsis 优先，其次 choco 的
          # 默认安装目录。CPack 的 NSIS 生成器是「从 PATH 里找 makensis」的，
          # 因此找到后必须把它所在目录并入 PATH，否则会报
          # "Cannot find NSIS compiler makensis"。
          found="$(command -v makensis || true)"
          if [ -z "$found" ] && [ -x '/c/Program Files (x86)/NSIS/makensis.exe' ]; then
            found='/c/Program Files (x86)/NSIS/makensis.exe'
          fi
          if [ -z "$found" ]; then
            echo "::error::找不到 makensis，NSIS 未安装成功"
            exit 1
          fi
          MAKENSIS="$(cygpath -m "$found")"
          export PATH="$(dirname "$found"):$PATH"
          echo "makensis: $MAKENSIS"

          mkdir -p out/package dist
          cpack --config out/build/ci-win/CPackConfig.cmake -G NSIS \
            -B out/package -D CPACK_NSIS_EXECUTABLE="$MAKENSIS"
          cp out/package/*.exe dist/
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: CatET-Windows-x64
          path: dist/*
          if-no-files-found: error

  # ── Linux：deb / rpm 系统安装包（x64 与 arm64）──────────────────────────────
  linux:
    name: Linux ${{ matrix.arch }} (deb/rpm)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          # GitHub 托管的 arm64 运行器（公开仓库可用；若不可用，删掉该项即可）
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="$GITHUB_REF_NAME"
          v="${v#v}"
          [ -n "$v" ] || v="0.0.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "本次构建版本号: $v"

      - name: 取回内嵌 UI 字体
        continue-on-error: true
        run: python3 .github/scripts/fetch_font.py

      # raylib 6.0 由 FetchContent 自行编译（静态），这里装的是它链接所需的
      # GL / X11 开发库与打包工具（rpmbuild 用于生成 rpm）。
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 pkg-config rpm dpkg-dev \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libxkbcommon-dev

      - name: 构建 + 打包（DEB / RPM）
        env:
          CATET_VERSION: ${{ steps.ver.outputs.version }}
        run: python3 build.py --platform linux

      - name: 整理产物
        run: |
          mkdir -p dist
          cp Linux/*.deb Linux/*.rpm dist/
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: CatET-Linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ── macOS：一次构建「通用二进制」.app + DMG（同时支持 Apple Silicon 与 Intel）
  #
  # 刻意不使用 macos-13（Intel）runner：这类 runner 数量少，实测排队 40+ 分钟
  # 都分配不到机器，把整个 Release 堵住。改为在 arm64 runner 上用
  # CMAKE_OSX_ARCHITECTURES="arm64;x86_64" 交叉编译出通用二进制，一个产物通吃。
  macos:
    name: macOS universal (dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="$GITHUB_REF_NAME"
          v="${v#v}"
          [ -n "$v" ] || v="0.0.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "本次构建版本号: $v"

      - name: 取回内嵌 UI 字体
        continue-on-error: true
        run: python3 .github/scripts/fetch_font.py

      - name: 构建 + DMG 打包（通用二进制）
        env:
          CATET_VERSION: ${{ steps.ver.outputs.version }}
          CATET_MACOS_ARCH: "arm64;x86_64"
        run: python3 build.py --platform macos

      # 只在日志里确认一下确实打进了两个架构，缺文件也不让 job 失败
      - name: 打印产物架构
        run: |
          BIN=out/build/macos-release/package/CatET.app/Contents/MacOS/CatET
          if [ -f "$BIN" ]; then
            echo "lipo -archs: $(lipo -archs "$BIN")"
            file "$BIN"
          else
            echo "未找到 $BIN，跳过架构校验"
          fi

      - name: 整理产物
        run: |
          mkdir -p dist
          cp MacOS/*.dmg dist/
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: CatET-MacOS-universal
          path: dist/*
          if-no-files-found: error

  # ── 汇总：把各平台安装包发布到 Releases（仅 tag 触发时）────────────────────
  release:
    name: 发布到 Releases
    needs: [windows, linux, macos]
    # 即使某个平台构建失败也照常发布已成功的产物（缺失部分在页面上一目了然）
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: CatET-*
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh release-assets

      - name: 创建 / 更新 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 没有 actions/checkout，目录里不是 git 仓库，
          # gh 无法自行推断仓库，必须显式指定（GH_REPO + --repo）。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"

          files=(release-assets/*)
          if [ ! -e "${files[0]}" ]; then
            echo "::error::没有可上传的产物，检查上游 job 是否都成功"
            exit 1
          fi
          ls -lh release-assets

          gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1 \
            || gh release create "$tag" \
              --repo "$GH_REPO" \
              --title "$tag" \
              --generate-notes

          gh release upload "$tag" release-assets/* \
            --repo "$GH_REPO" \
            --clobber
